[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scan-cleaner"
dynamic = ["version"]
description = "Find Pokemon detail screenshots (the screens appraisal apps scan) and move or delete them, offline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scan-cleaner = "scan_cleaner.cli:main"

[tool.hatch.version]
path = "src/scan_cleaner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scan_cleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
